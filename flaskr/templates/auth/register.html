{% extends 'base.html' %}

{% block header %}
  <h1>{% block title %}Registrazione{% endblock %}</h1>
{% endblock %}

{% block content %}
  <form method="post">
    <label for="username">Matricola</label>
    <input name="username" id="username" required type="number" min="2000000" max="3000000">
    <label for="password">Password</label>
    <input type="password" name="password" id="password" required>
    <input type="submit" value="Registra">
  </form>
{% endblock %}
